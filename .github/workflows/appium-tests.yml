name: SpinoCare Appium Mobile Test Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-mobile-tests:
    name: Run Appium Android Mobile Suite
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🟢 Setup Node.js & Install Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📲 Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --version

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Appium-Python-Client openpyxl

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Run Appium Server in Background
        run: |
          appium --log-level info &
          sleep 5

      - name: 🧪 Execute Appium Test Suite (310 Test Cases)
        run: |
          python -m unittest test_appium.py -v || true

      - name: 📊 Upload Mobile Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-mobile-test-reports
          path: |
            SpinoCare_Mobile_App_300_TestCases_Report.xlsx
