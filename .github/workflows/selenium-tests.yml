name: SpinoCare Selenium Web Test Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: Run Selenium E2E Web Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🌐 Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium openpyxl

      - name: 🚀 Start SpinoCare Web Server
        run: |
          cd website
          python -m http.server 8000 &
          sleep 3

      - name: 🧪 Execute Selenium Test Suite (315 Test Cases)
        run: |
          python -m unittest test_selenium.py -v

      - name: 📊 Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            SpinoCare_WebApplication_Selenium_300_TestCases_Report.xlsx
