<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History | SpinoCare</title>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .conf-badge-modic {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            background: rgba(242, 102, 102, 0.15);
            color: #F26666;
            border-radius: 12px;
            white-space: nowrap;
        }

        .conf-badge-normal {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            border-radius: 12px;
            white-space: nowrap;
        }

        .history-empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }

        .history-empty-state i {
            font-size: 3.5rem;
            color: var(--primary);
            opacity: 0.5;
            margin-bottom: 1rem;
            display: block;
        }
    </style>
</head>

<body>

    <div id="common-header"></div>
    <script src="components.js"></script>

    <div class="container" style="padding-top: 3rem; padding-bottom: 5rem;">
        
        <!-- Header Title -->
        <div style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--accent); margin-bottom: 0.4rem;">
                    Diagnostic <span style="color: var(--primary);">History</span>
                </h1>
                <p style="color: var(--text-muted); font-size: 1rem;">Manage, compare, and download past spinal MRI AI diagnostic reports.</p>
            </div>
        </div>

        <!-- Controls Bar: Search, Filters, Sort, View Toggle -->
        <div class="history-controls-bar">
            <div class="history-search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="history-search-input" class="history-search-input" placeholder="Search by diagnosis, date, or ID...">
            </div>

            <div class="history-filters">
                <button class="history-tag-pill active" data-filter="all">All</button>
                <button class="history-tag-pill" data-filter="modic">Modic Change</button>
                <button class="history-tag-pill" data-filter="nomodic">No Modic</button>
            </div>

            <div class="history-view-actions">
                <select id="history-sort-select" style="padding: 0.5rem 1rem; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-light); color: var(--text-main); font-size: 0.85rem; font-weight: 600; cursor: pointer; outline: none;">
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                    <option value="confidence">Highest Confidence</option>
                </select>

                <button class="view-toggle-btn active" id="btn-view-grid" title="Grid View">
                    <i class="fa-solid fa-grid-2"></i>
                </button>
                <button class="view-toggle-btn" id="btn-view-list" title="List View">
                    <i class="fa-solid fa-list"></i>
                </button>
            </div>
        </div>

        <!-- History Cards List Container -->
        <div id="history-list" class="grid-view animate-fade-in"></div>
    </div>

    <!-- Side-by-Side Compare Modal -->
    <div class="compare-modal-overlay" id="compare-modal">
        <div class="compare-modal-card">
            <div class="compare-header">
                <div>
                    <h3 id="compare-modal-title">Side-by-Side Scan Comparison</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted);" id="compare-modal-sub">—</p>
                </div>
                <button class="compare-close-btn" id="compare-close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <!-- T1 and T2 Side by Side Grid -->
            <div class="compare-mri-grid">
                <div class="compare-mri-box">
                    <span class="compare-mri-label">T1-Weighted Scan</span>
                    <img id="compare-t1-img" src="" alt="T1 MRI Scan">
                </div>
                <div class="compare-mri-box">
                    <span class="compare-mri-label">T2-Weighted Scan</span>
                    <img id="compare-t2-img" src="" alt="T2 MRI Scan">
                </div>
            </div>

            <!-- Score breakdown sheet -->
            <div style="background: var(--bg-light); border-radius: 16px; padding: 1.25rem; border: 1px solid var(--border-color); display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">DIAGNOSIS</span>
                    <strong id="compare-diag" style="font-size: 1.1rem; color: var(--primary);">—</strong>
                </div>
                <div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">CONFIDENCE SCORE</span>
                    <strong id="compare-conf" style="font-size: 1.1rem; color: var(--text-main);">—</strong>
                </div>
                <div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">PROCESSING TIME</span>
                    <strong id="compare-time" style="font-size: 1.1rem; color: var(--text-main);">—</strong>
                </div>
            </div>
        </div>
    </div>


    <script>
        // Auth check
        if (!localStorage.getItem('spinocare_auth_token')) {
            window.location.href = 'login.html';
        }

        let allEntries = [];
        let activeFilter = 'all';
        let currentView = 'grid';

        document.addEventListener('DOMContentLoaded', () => {
            allEntries = JSON.parse(localStorage.getItem('spinocare_history') || '[]');
            
            setupEventListeners();
            renderHistory();
        });

        function setupEventListeners() {
            // Search Input
            const searchInput = document.getElementById('history-search-input');
            searchInput.addEventListener('input', renderHistory);

            // Filter Tags
            const filterPills = document.querySelectorAll('.history-tag-pill');
            filterPills.forEach(pill => {
                pill.addEventListener('click', (e) => {
                    filterPills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    activeFilter = pill.dataset.filter;
                    renderHistory();
                });
            });

            // Sort Select
            const sortSelect = document.getElementById('history-sort-select');
            sortSelect.addEventListener('change', renderHistory);

            // View Toggle
            const btnGrid = document.getElementById('btn-view-grid');
            const btnList = document.getElementById('btn-view-list');
            const historyContainer = document.getElementById('history-list');

            btnGrid.addEventListener('click', () => {
                btnGrid.classList.add('active');
                btnList.classList.remove('active');
                historyContainer.classList.remove('list-view');
                historyContainer.classList.add('grid-view');
            });

            btnList.addEventListener('click', () => {
                btnList.classList.add('active');
                btnGrid.classList.remove('active');
                historyContainer.classList.remove('grid-view');
                historyContainer.classList.add('list-view');
            });

            // Compare Modal Close
            document.getElementById('compare-close-btn').addEventListener('click', closeCompareModal);
            document.getElementById('compare-modal').addEventListener('click', (e) => {
                if (e.target.id === 'compare-modal') closeCompareModal();
            });
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const searchTerm = document.getElementById('history-search-input').value.toLowerCase();
            const sortVal = document.getElementById('history-sort-select').value;

            list.innerHTML = '';

            // Filter entries
            let filtered = allEntries.filter(entry => {
                const label = (entry.label || '').toLowerCase();
                const date = (entry.dateStr || '').toLowerCase();
                const id = (entry.entryId || '').toLowerCase();
                
                const matchesSearch = label.includes(searchTerm) || date.includes(searchTerm) || id.includes(searchTerm);
                
                let matchesTag = true;
                if (activeFilter === 'modic') matchesTag = entry.isModic;
                if (activeFilter === 'nomodic') matchesTag = !entry.isModic;

                return matchesSearch && matchesTag;
            });

            // Sort entries
            filtered.sort((a, b) => {
                if (sortVal === 'newest') return (b.timestamp || 0) - (a.timestamp || 0);
                if (sortVal === 'oldest') return (a.timestamp || 0) - (b.timestamp || 0);
                if (sortVal === 'confidence') return (b.confidence || 0) - (a.confidence || 0);
                return 0;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                <div class="history-empty-state">
                    <i class="fa-solid fa-box-archive"></i>
                    <h3>No Analysis Records Found</h3>
                    <p>No MRI scans match your current filter or search criteria.</p>
                    <a href="index.html#analyzer" style="display:inline-block;margin-top:16px;padding:10px 24px;background:var(--primary);color:white;border-radius:20px;text-decoration:none;font-weight:600;font-size:0.95rem;">
                        Start New Analysis
                    </a>
                </div>`;
                return;
            }

            filtered.forEach((entry, idx) => {
                const card = document.createElement('div');
                card.className = 'report-card-modern';
                
                const isModic = entry.isModic;
                const badgeClass = isModic ? 'conf-badge-modic' : 'conf-badge-normal';
                
                // Fallback thumbnail placeholders if t1/t2 empty
                const t1Thumb = entry.t1 || 'hero-mri.webp';
                const t2Thumb = entry.t2 || 'hero-mri.webp';

                card.innerHTML = `
                <div class="report-card-top">
                    <div class="report-thumb-pair">
                        <img src="${t1Thumb}" alt="T1">
                        <img src="${t2Thumb}" alt="T2">
                    </div>
                    <div class="report-card-info">
                        <h4>${entry.label}</h4>
                        <p><i class="fa-regular fa-clock"></i> ${entry.dateStr} &nbsp;&bull;&nbsp; Local AI</p>
                    </div>
                    <span class="${badgeClass}">${entry.confidence}% Match</span>
                </div>

                <div class="action-buttons-group">
                    <button class="btn-secondary-action" onclick="openCompareModal('${entry.entryId}')">
                        <i class="fa-solid fa-layer-group"></i> Compare Scans
                    </button>
                    <button class="btn-secondary-action" id="dl-btn-${idx}">
                        <i class="fa-solid fa-file-arrow-down"></i> Report
                    </button>
                    <button class="btn-secondary-action" style="color: var(--primary-light); flex: 0 0 auto; width: 40px;" onclick="deleteHistoryEntry('${entry.entryId}')" title="Delete Entry">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>`;

                list.appendChild(card);

                // Attach PDF event
                document.getElementById(`dl-btn-${idx}`).addEventListener('click', async function () {
                    this.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
                    this.disabled = true;
                    await generatePDFReport(entry, entry.t1, entry.t2);
                    this.innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => {
                        this.innerHTML = '<i class="fa-solid fa-file-arrow-down"></i> Report';
                        this.disabled = false;
                    }, 2500);
                });
            });
        }

        function openCompareModal(entryId) {
            const entry = allEntries.find(e => e.entryId === entryId);
            if (!entry) return;

            document.getElementById('compare-modal-title').textContent = entry.label;
            document.getElementById('compare-modal-sub').textContent = `Report ID: ${entry.entryId} • Date: ${entry.dateStr}`;
            document.getElementById('compare-t1-img').src = entry.t1 || 'hero-mri.webp';
            document.getElementById('compare-t2-img').src = entry.t2 || 'hero-mri.webp';
            document.getElementById('compare-diag').textContent = entry.label;
            document.getElementById('compare-conf').textContent = `${entry.confidence}%`;
            document.getElementById('compare-time').textContent = `${((entry.time || 450) / 1000).toFixed(2)}s`;

            document.getElementById('compare-modal').classList.add('active');
        }

        function closeCompareModal() {
            document.getElementById('compare-modal').classList.remove('active');
        }

        function deleteHistoryEntry(entryId) {
            if (!confirm('Are you sure you want to delete this scan entry from your history?')) return;
            allEntries = allEntries.filter(e => e.entryId !== entryId);
            localStorage.setItem('spinocare_history', JSON.stringify(allEntries));
            renderHistory();
        }

        // ── PDF Generator matching iOS HistoryView createPDF ─────────────────────
        async function generatePDFReport(result, t1Src, t2Src) {
            const PW = 794, PH = 1123, M = 53, CW = PW - M * 2;
            const CORAL = '#F26666', LIGHT_PINK = '#FAEBEB', ROW_ALT = '#F7F7F7';
            const TEXT_DARK = '#222', TEXT_MUTED = '#666', DIVIDER = '#E0E0E0';

            const canvas = document.createElement('canvas');
            canvas.width = PW; canvas.height = PH;
            const c = canvas.getContext('2d');
            c.fillStyle = 'white'; c.fillRect(0, 0, PW, PH);

            // Header
            c.fillStyle = CORAL; c.fillRect(0, 0, PW, 117);

            await new Promise(function (resolve) {
                const logoImg = new Image();
                logoImg.onload = function () {
                    c.save();
                    c.beginPath();
                    c.arc(M + 37, 58, 37, 0, Math.PI * 2);
                    c.clip();
                    c.drawImage(logoImg, M, 58 - 37, 74, 74);
                    c.restore();
                    resolve();
                };
                logoImg.onerror = function () {
                    c.fillStyle = 'rgba(255,255,255,0.25)';
                    c.beginPath(); c.arc(M + 37, 58, 37, 0, Math.PI * 2); c.fill();
                    c.fillStyle = 'white'; c.font = 'bold 22px Inter, sans-serif';
                    c.textAlign = 'center'; c.fillText('SC', M + 37, 65);
                    resolve();
                };
                logoImg.src = 'app-logo.webp';
            });

            c.textAlign = 'left';
            c.font = 'bold 26px Inter, sans-serif'; c.fillText('SpinoCare', M + 88, 50);
            c.font = '13px Inter, sans-serif'; c.fillStyle = 'rgba(255,255,255,0.85)';
            c.fillText('Medical MRI Analysis Report', M + 88, 72);
            c.textAlign = 'right'; c.font = '12px Inter, sans-serif';
            c.fillText('Date: ' + result.dateStr, M + CW, 72); c.textAlign = 'left';

            let y = 141;

            c.fillStyle = LIGHT_PINK; c.fillRect(M, y, CW, 32);
            c.fillStyle = CORAL; c.fillRect(M, y, 5, 32);
            c.fillStyle = TEXT_DARK; c.font = 'bold 13px Inter, sans-serif';
            c.fillText('ANALYSIS RESULTS', M + 14, y + 21); y += 44;

            const col1W = 200, rowH = 34;
            const rows = [
                ['Diagnosis Result', result.label],
                ['Confidence Score', result.confidence + '%'],
                ['No Modic Score', result.noModic + '%'],
                ['Modic Change Score', result.confidence + '%'],
                ['Analysis Mode', 'Offline (Local AI)'],
                ['Processing Time', ((result.time || 450) / 1000).toFixed(2) + ' sec'],
                ['AI Model Version', 'v2.3'],
                ['Report ID', result.entryId],
            ];

            c.strokeStyle = DIVIDER; c.lineWidth = 1;
            roundRect(c, M, y, CW, rows.length * rowH, 6, false, true);

            rows.forEach(function ([lbl, val], i) {
                const ry = y + i * rowH;
                c.fillStyle = i % 2 === 0 ? 'white' : ROW_ALT; c.fillRect(M, ry, CW, rowH);
                c.strokeStyle = DIVIDER; c.lineWidth = 0.5;
                c.beginPath(); c.moveTo(M + col1W, ry); c.lineTo(M + col1W, ry + rowH); c.stroke();
                if (i < rows.length - 1) {
                    c.beginPath(); c.moveTo(M, ry + rowH); c.lineTo(M + CW, ry + rowH); c.stroke();
                }
                c.fillStyle = TEXT_MUTED; c.font = 'bold 11px Inter, sans-serif';
                c.fillText(lbl, M + 12, ry + 22);
                const isRes = lbl === 'Diagnosis Result';
                c.fillStyle = (isRes && result.isModic) ? CORAL : TEXT_DARK;
                c.font = isRes ? 'bold 11px Inter, sans-serif' : '11px Inter, sans-serif';
                c.fillText(val, M + col1W + 12, ry + 22);
            });

            y += rows.length * rowH + 24;

            c.fillStyle = LIGHT_PINK; c.fillRect(M, y, CW, 28);
            c.fillStyle = CORAL; c.fillRect(M, y, 5, 28);
            c.fillStyle = TEXT_DARK; c.font = 'bold 13px Inter, sans-serif';
            c.fillText('MRI SCAN IMAGES', M + 14, y + 19); y += 34;

            const gutter = 14, imgColW = (CW - gutter) / 2, imgH = 200;

            async function drawImg(src, label, x, topY) {
                c.fillStyle = 'rgba(242,102,102,0.1)';
                roundRect(c, x, topY, imgColW, 22, 4, true, false);
                c.fillStyle = CORAL; c.font = 'bold 11px Inter, sans-serif';
                c.textAlign = 'center'; c.fillText(label, x + imgColW / 2, topY + 15); c.textAlign = 'left';
                const imgY = topY + 26;
                c.strokeStyle = DIVIDER; c.lineWidth = 1;
                roundRect(c, x, imgY, imgColW, imgH, 4, false, true);
                if (src && src.length > 10) {
                    await new Promise(function (res) {
                        const img = new Image();
                        img.onload = function () {
                            c.save(); roundRect(c, x, imgY, imgColW, imgH, 4, false, false); c.clip();
                            c.drawImage(img, x, imgY, imgColW, imgH); c.restore(); res();
                        };
                        img.onerror = res; img.src = src;
                    });
                } else {
                    c.fillStyle = TEXT_MUTED; c.font = '11px Inter, sans-serif';
                    c.textAlign = 'center'; c.fillText('Not available', x + imgColW / 2, imgY + imgH / 2); c.textAlign = 'left';
                }
            }

            await drawImg(t1Src, 'T1-Weighted MRI', M, y);
            await drawImg(t2Src, 'T2-Weighted MRI', M + imgColW + gutter, y);

            const footerY = PH - 80;
            c.strokeStyle = DIVIDER; c.lineWidth = 0.5;
            c.beginPath(); c.moveTo(M, footerY); c.lineTo(M + CW, footerY); c.stroke();
            c.fillStyle = TEXT_MUTED; c.font = '9px Inter, sans-serif'; c.textAlign = 'center';
            c.fillText('This report is generated by SpinoCare AI for informational purposes only.', PW / 2, footerY + 16);
            c.textAlign = 'right';
            c.fillText('Page 1  |  ID: ' + result.entryId, M + CW, footerY + 50);

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 0.98);
            link.download = 'SpinoCare_Report_' + result.entryId + '.jpg';
            link.click();
        }

        function roundRect(ctx, x, y, w, h, r, fill, stroke) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
            if (fill) ctx.fill();
            if (stroke) ctx.stroke();
        }
    </script>
</body>

</html>
